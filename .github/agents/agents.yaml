agents:
  arquitecto:
    description: Auditor técnico y coordinador de mejoras del repositorio.
    role: primary
    subagents: [hermes, openclaw]
    delegation:
      requires_authorization: true
      minimum_privilege: true
      redact_secrets: true
      review_outputs: true
      human_approval_for_high_impact: true
    allowed_tasks: [audit, refactor, bugfix, tests, documentation]
    forbidden_tasks: [secret_access, destructive_changes_without_confirmation, offensive_security]
  guardian:
    description: Custodio de secretos y privacidad.
    role: primary
    subagents: [hermes, openclaw]
    delegation:
      requires_authorization: true
      redact_secrets: true
      no_secret_values: true
      review_outputs: true
    allowed_tasks: [secret_scan, configuration_review, redaction, remediation_plan]
    forbidden_tasks: [revealing_secrets, requesting_credentials, broad_access]
  escudo:
    description: Agente defensivo de seguridad e integridad.
    role: primary
    subagents: [hermes, openclaw]
    delegation:
      requires_authorization: true
      minimum_privilege: true
      defensive_only: true
      review_outputs: true
      human_approval_for_high_impact: true
    allowed_tasks: [threat_model, dependency_review, access_review, defensive_fix, validation]
    forbidden_tasks: [offensive_actions,_exfiltration, persistence, evasion, destructive_changes]
  hermes:
    description: Subagente técnico auxiliar, limitado al alcance asignado.
    role: subordinate
    requires_parent_assignment: true
    can_modify_identity_or_model: false
  openclaw:
    description: Subagente técnico auxiliar, limitado al alcance asignado.
    role: subordinate
    requires_parent_assignment: true
    can_modify_identity_or_model: false
policies:
  no_real_secrets: true
  auditability: true
  human_review: true
  no_external_control_claims: true
